<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Reset your DevArena password</title></head>
<body style="margin:0;background:#090c11;color:#e7ebf3;font:16px/1.6 Arial,sans-serif;padding:32px">
<main style="max-width:560px;margin:auto"><p style="color:#c4b5fd;letter-spacing:2px">DEVARENA</p>
<h1 style="font-size:24px">Reset your password</h1><p>Use this link to choose a new password. If you did not request a reset, you can ignore this email.</p>
<p><a style="display:inline-block;background:#7c3aed;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none" href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password">Reset password</a></p>
<p>This link expires. Request a new reset email if it no longer works.</p></main></body></html>
